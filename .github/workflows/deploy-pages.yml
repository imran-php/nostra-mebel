name: Publish NOSTRA to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [nostra-pages.zip]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Unpack public site
        run: |
          unzip -q nostra-pages.zip -d _site
          test -f _site/index.html
          test -f _site/facades/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
